<a href="#rooms" class="explore">探索客房 <svg aria-hidden="true"><use href="#arrow"/></svg></a>
</div>
<div class="coordinates"><svg><use href="#pin"/></svg> 浙江 · 莫干山 <span></span><em>30°36′ N &nbsp; 119°52′ E</em></div>
</div>
<figure class="hero-photo">
<img id="hero-img" src="assets/hero.webp" alt="午后的山景客房，床边的窗户望向山林" fetchpriority="high">
<figcaption><span class="photo-data"><small>LODGE VIEW <b> / </b> <span id="counter">01</span> — 03</small><strong id="caption">林间客房 · 午后</strong></span><span class="photo-control"><button id="prev" aria-label="上一张客房照片"><svg><use href="#arrow"/></svg></button><button id="next" aria-label="下一张客房照片"><svg><use href="#arrow"/></svg></button></span></figcaption>

<div><svg><use href="#bed"/></svg><p>六间客房<small>SIX GUEST ROOMS</small></p></div>
<div><svg><use href="#sun"/></svg><p>山居早餐<small>SEASONAL BREAKFAST</small></p></div>
<div><svg><use href="#leaf"/></svg><p>自然栖居<small>SLOW LIVING</small></p></div>
</div>
